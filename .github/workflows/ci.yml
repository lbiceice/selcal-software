name: Artifact-first CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    if: ${{ github.event.repository.private == false }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        numpy: ["2.4.6"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            numpy: "1.26.4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build frontend
        run: python -I -m pip install "build>=1.2,<2"
      - name: Build and check delivered artifacts
        run: python -I scripts/ci_check.py "${{ runner.temp }}/selcal-ci" --numpy-version "${{ matrix.numpy }}"
      - name: Preserve results and built artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selcal-${{ matrix.os }}-py${{ matrix.python }}-np${{ matrix.numpy }}
          path: |
            ${{ runner.temp }}/selcal-ci/evidence
            ${{ runner.temp }}/selcal-ci/artifacts
          if-no-files-found: warn
          retention-days: 14
